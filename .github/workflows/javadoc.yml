name: Publish Javadoc

on:
  push:
    branches: [main]
    paths:
      - "freshly-backend/platform/**"
      - "freshly-backend/build.gradle.kts"
      - "freshly-backend/buildSrc/**"
      - ".github/workflows/javadoc.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: freshly-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25 (Azul Zulu)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate Javadoc
        run: ./gradlew docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Javadoc artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: freshly-backend/build/docs/javadoc

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
