spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/freshly

application:
  mail:
    from: test@freshly.local
  auth:
    callback-url: http://localhost:8080/api/v1/auth/callback
    post-login-url: http://localhost:8080/api/v1/swagger-ui.html
  cors:
    allowed-origins: http://localhost:8080
  airquality:
    sync:
      enabled: false
  keycloak:
    server-url: http://localhost:9000
    realm: freshly
    admin-client-id: test-admin
    admin-client-secret: test-admin-secret
    user-client-id: test-user
    user-client-secret: test-user-secret
