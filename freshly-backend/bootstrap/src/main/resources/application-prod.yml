spring:
  mongodb:
    host: ${MONGO_HOST}
    port: ${MONGO_PORT}
    database: ${MONGO_DATABASE}
    username: ${MONGO_USERNAME}
    password: ${MONGO_PASSWORD}
    authentication-database: ${MONGO_AUTH_DATABASE}
    replica-set-name: ${MONGO_REPLICA_SET_NAME}
    ssl:
      bundle: internal-ca
  ssl:
    bundle:
      pem:
        internal-ca:
          truststore:
            certificate: ${INTERNAL_CA_CERT}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

application:
  auth:
    callback-url: ${AUTH_CALLBACK_URL}
    post-login-url: ${AUTH_POST_LOGIN_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  airquality:
    sync:
      enabled: ${AIRQUALITY_SYNC_ENABLED}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    user-client-id: ${KEYCLOAK_USER_CLIENT_ID}
    user-client-secret: ${KEYCLOAK_USER_CLIENT_SECRET}

logging:
  level:
    root: WARN
    com.vertyll.freshly: INFO
