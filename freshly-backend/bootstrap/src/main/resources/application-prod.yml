spring:
  mongodb:
    uri: ${MONGODB_URI}
    ssl:
      bundle: internal-ca
  ssl:
    bundle:
      pem:
        internal-ca:
          truststore:
            certificate: ${INTERNAL_CA_CERT}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

application:
  mail:
    from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  airquality:
    sync:
      enabled: ${AIRQUALITY_SYNC_ENABLED}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    user-client-id: ${KEYCLOAK_USER_CLIENT_ID}
    user-client-secret: ${KEYCLOAK_USER_CLIENT_SECRET}

logging:
  level:
    root: WARN
    com.vertyll.freshly: INFO
