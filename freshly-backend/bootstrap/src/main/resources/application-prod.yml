spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}


springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  mail:
    from: ${MAIL_FROM}
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration:
      email-verification: 24h
      password-reset: 30m
  frontend:
    url: ${FRONTEND_URL}
  keycloak:
    server-url: ${KEYCLOAK_SERVER_URL}
    realm: ${KEYCLOAK_REALM}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    public-client-id: ${KEYCLOAK_PUBLIC_CLIENT_ID}
  airquality:
    sync:
      enabled: true
    gios:
      base-url: https://api.gios.gov.pl/pjp-api/v1/rest
      connect-timeout: 5s
      read-timeout: 20s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.vertyll.freshly: INFO
