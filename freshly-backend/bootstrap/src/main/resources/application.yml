spring:
  application:
    name: freshly-backend
  profiles:
    default: local
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mongodb:
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  session:
    data:
      redis:
        namespace: freshly:session
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences:
            - freshly-api
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  ssl:
    bundle:
      pem:
        gios:
          truststore:
            certificate: classpath:certs/certum-trusted-root-ca.pem

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api/v1
    session:
      timeout: 10h
      cookie:
        name: FRESHLY_SESSION
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  airquality:
    gios:
      base-url: https://api.gios.gov.pl/pjp-api/v1/rest
      ssl-bundle: gios
      connect-timeout: 5s
      read-timeout: 20s
