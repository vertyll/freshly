spring:
  application:
    name: freshly-backend
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  mongodb:
    representation:
      uuid: standard
  data:
    mongodb:
      auto-index-creation: true
  ssl:
    bundle:
      pem:
        gios:
          truststore:
            certificate: classpath:certs/certum-trusted-root-ca.pem
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

application:
  jwt:
    expiration:
      email-verification: 24h
      password-reset: 30m
  airquality:
    gios:
      base-url: https://api.gios.gov.pl/pjp-api/v1/rest
      ssl-bundle: gios
      connect-timeout: 5s
      read-timeout: 20s
