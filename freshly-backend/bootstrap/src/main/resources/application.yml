spring:
  application:
    name: freshly-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json

server:
  servlet:
    context-path: /api/v1/
