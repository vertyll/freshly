spring:
  mongodb:
    uri: mongodb://localhost:27017/freshly
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: localhost
    port: 1025

server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

application:
  mail:
    from: no-reply@freshly.local
  auth:
    callback-url: http://localhost:8080/api/v1/auth/callback
    post-login-url: http://localhost:8080/api/v1/swagger-ui.html
  cors:
    allowed-origins: http://localhost:8080
  airquality:
    sync:
      enabled: true
  keycloak:
    realm-url: http://localhost:9000/realms/freshly
    client-secret: local-app-client-secret
    admin:
      client-secret: local-service-account-secret

logging:
  level:
    com.vertyll.freshly: DEBUG
