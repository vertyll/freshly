spring:
  mongodb:
    uri: mongodb://localhost:27017/freshly
  mail:
    host: localhost
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/freshly

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: false

application:
  mail:
    from: no-reply@freshly.local
  auth:
    callback-url: http://localhost:8080/api/v1/auth/callback
    post-login-url: http://localhost:8080/api/v1/swagger-ui.html
  cors:
    allowed-origins: http://localhost:8080
  airquality:
    sync:
      enabled: true
  keycloak:
    server-url: http://localhost:9000
    realm: freshly
    admin-client-id: freshly-service-account
    admin-client-secret: local-service-account-secret
    user-client-id: freshly-app-client
    user-client-secret: local-app-client-secret

logging:
  level:
    com.vertyll.freshly: DEBUG
