<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title th:text="#{email.userRegistered.title}">Title</title>
</head>
<body style="margin: 0; padding: 0; background-color: #121212; color: #e8e8e8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; border-collapse: collapse; background-color: #121212;">
    <tr>
        <td align="center" bgcolor="#121212" style="padding: 40px 16px;">
            <table role="presentation" width="560" align="center" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 560px; border-collapse: collapse;">
                <tr>
                    <td style="padding: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a0a0a0;" th:text="#{common.freshly}">Freshly</td>
                </tr>
                <tr>
                    <td bgcolor="#1a1a1a" style="background-color: #1a1a1a; border: 1px solid #303030; padding: 32px; overflow-wrap: anywhere;">
                        <h1 style="margin: 0 0 20px; font-size: 22px; font-weight: 600; line-height: 1.3; color: #e8e8e8;" th:text="#{email.userRegistered.title}">Title</h1>
                        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;"><span th:text="#{email.userRegistered.greeting}">Hi</span> <strong th:text="${username}">User</strong>,</p>
                        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;" th:text="#{email.userRegistered.intro}">Intro</p>
                        <h2 style="margin: 24px 0 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a0a0a0;" th:text="#{email.userRegistered.nextSteps}">What's Next?</h2>
                        <ul style="margin: 0 0 16px; padding-left: 20px; font-size: 15px; color: #e8e8e8;">
                            <li style="margin: 0 0 6px;" th:text="#{email.userRegistered.step1}">Step 1</li>
                            <li style="margin: 0 0 6px;" th:text="#{email.userRegistered.step2}">Step 2</li>
                            <li style="margin: 0 0 6px;" th:text="#{email.userRegistered.step3}">Step 3</li>
                        </ul>
                        <p style="margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #303030; font-size: 13px; color: #a0a0a0;" th:text="#{email.userRegistered.support}">Support</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 16px 0 0; font-size: 12px; text-align: center; color: #a0a0a0;">
                        <p style="margin: 0 0 4px;" th:text="#{common.copyright}">&copy; 2026 Freshly. All rights reserved.</p>
                        <p style="margin: 0 0 4px;" th:text="#{email.userRegistered.footer}">This is an automated message, please do not reply.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
