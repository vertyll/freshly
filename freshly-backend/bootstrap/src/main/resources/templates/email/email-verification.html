<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="supported-color-schemes" content="dark">
    <title th:text="#{email.verification.title}">Title</title>
</head>
<body style="margin: 0; padding: 0; background-color: #121212; color: #e8e8e8; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6;">
<table role="presentation" style="width: 100%; border-collapse: collapse; background-color: #121212;">
    <tr>
        <td style="padding: 40px 16px;">
            <table role="presentation" style="width: 100%; border-collapse: collapse; max-width: 560px; margin: 0 auto;">
                <tr>
                    <td style="padding: 0 0 16px; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a0a0a0;" th:text="#{common.freshly}">Freshly</td>
                </tr>
                <tr>
                    <td style="background-color: #1a1a1a; border: 1px solid #303030; padding: 32px;">
                        <h1 style="margin: 0 0 20px; font-size: 22px; font-weight: 600; line-height: 1.3; color: #e8e8e8;" th:text="#{email.verification.title}">Title</h1>
                        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;"><span th:text="#{email.verification.greeting}">Hi</span> <strong th:text="${username}">User</strong>,</p>
                        <p style="margin: 0 0 16px; font-size: 15px; color: #e8e8e8;" th:text="#{email.verification.intro}">Intro</p>
                        <table role="presentation" style="border-collapse: collapse; margin: 8px 0 24px;">
                            <tr>
                                <td style="background-color: #6aa9ff;">
                                    <a th:href="${verificationLink}" href="#" style="display: inline-block; padding: 12px 28px; font-size: 15px; font-weight: 600; color: #0d1117; text-decoration: none;" th:text="#{email.verification.button}">Button</a>
                                </td>
                            </tr>
                        </table>
                        <p style="margin: 0 0 8px; font-size: 13px; color: #a0a0a0;" th:text="#{email.linkHint}">Or copy and paste this link into your browser:</p>
                        <p style="margin: 0 0 16px; font-size: 13px; word-break: break-all;"><a th:href="${verificationLink}" href="#" style="color: #6aa9ff; text-decoration: underline;" th:text="${verificationLink}">link</a></p>
                        <p style="margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #303030; font-size: 13px; color: #a0a0a0;"><span th:text="#{email.verification.expiry}">Expiry</span> <span th:text="#{email.verification.ignore}">Ignore</span></p>
                    </td>
                </tr>
                <tr>
                    <td style="padding: 16px 0 0; font-size: 12px; text-align: center; color: #a0a0a0;">
                        <p style="margin: 0 0 4px;" th:text="#{common.copyright}">&copy; 2026 Freshly. All rights reserved.</p>
                        <p style="margin: 0 0 4px;" th:text="#{email.verification.footer}">This is an automated message, please do not reply.</p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
