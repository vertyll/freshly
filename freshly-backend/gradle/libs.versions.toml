[versions]
jacoco = "0.8.15"
sonarqube = "7.5.0.8588"
java = "25"

spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spotless = "8.10.3"
errorprone-gradle-plugin = "5.1.1"
nullaway-gradle-plugin = "3.2.0"
spotbugs-gradle-plugin = "6.5.12"

errorprone = "2.50.0"
nullaway = "0.14.2"
beta-checker = "1.0"
pmd = "7.28.0"
spotbugs = "4.10.4"
findsecbugs = "1.14.0"
eclipse-jdt = "4.40"
jspecify = "1.0.1"
lombok = "1.18.48"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
keycloak = "26.0.12"
springdoc = "3.1.1"
icu4j = "78.3"
poi = "5.5.1"
archunit = "1.5.1"
testcontainers = "2.0.5"

[libraries]
sonarqube-gradle-plugin = { module = "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin", version.ref = "sonarqube" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-gradle-plugin" }
nullaway-gradle-plugin = { module = "net.ltgt.gradle:gradle-nullaway-plugin", version.ref = "nullaway-gradle-plugin" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-gradle-plugin" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-security-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }

spring-boot-starter-data-mongodb-test = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-test" }
spring-boot-starter-security-oauth2-resource-server-test = { module = "org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-validation-test = { module = "org.springframework.boot:spring-boot-starter-validation-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

spring-aop = { module = "org.springframework:spring-aop" }
spring-context = { module = "org.springframework:spring-context" }
spring-tx = { module = "org.springframework:spring-tx" }
aspectj-aspectjweaver = { module = "org.aspectj:aspectjweaver" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
slf4j-api = { module = "org.slf4j:slf4j-api" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
keycloak-admin-client = { module = "org.keycloak:keycloak-admin-client", version.ref = "keycloak" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
guava-beta-checker = { module = "com.google.guava:guava-beta-checker", version.ref = "beta-checker" }
spotbugs-annotations = { module = "com.github.spotbugs:spotbugs-annotations", version.ref = "spotbugs" }
findsecbugs = { module = "com.h3xstream.findsecbugs:findsecbugs-plugin", version.ref = "findsecbugs" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj-core = { module = "org.assertj:assertj-core" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

[bundles]
spring-boot-starters-common = [
    "spring-boot-starter-data-mongodb",
    "spring-boot-starter-validation",
    "spring-boot-starter-webmvc"
]

spring-boot-starters-oauth = [
    "spring-boot-starter-security-oauth2-resource-server"
]

spring-boot-starters-aop = [
    "spring-aop",
    "aspectj-aspectjweaver"
]

mapstruct-processors = [
    "mapstruct-processor",
    "lombok-mapstruct-binding"
]

test-unit = [
    "junit-jupiter",
    "assertj-core",
    "mockito-core",
    "mockito-junit-jupiter"
]

spring-boot-test-common = [
    "spring-boot-starter-webmvc-test",
    "spring-boot-starter-data-mongodb-test",
    "spring-boot-starter-validation-test"
]

test-starters = [
    "spring-boot-starter-data-mongodb-test",
    "spring-boot-starter-security-test",
    "spring-boot-starter-validation-test",
    "spring-boot-starter-webmvc-test",
    "spring-boot-starter-security-oauth2-resource-server-test",
    "spring-boot-testcontainers"
]

testcontainers = [
    "testcontainers-mongodb",
    "testcontainers-junit-jupiter"
]
